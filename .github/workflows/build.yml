name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake build-essential
          pip install --upgrade buildozer Cython==0.29.33

      - name: Install Android NDK r25b
        run: |
          mkdir -p /home/runner/ndk
          cd /home/runner/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_HOME: /home/runner/ndk/android-ndk-r25b
          ANDROIDNDK: /home/runner/ndk/android-ndk-r25b
        run: |
          yes | buildozer -v android debug arch:arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            bin/*.apk
            *.apk
